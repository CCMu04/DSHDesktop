name: Release preview

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty for build-only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:runtime
      - run: npm run prepare:node
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Save x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ github.run_id }}-x64
          path: |
            # 注意：artifact 路径是 glob，[recommend] 的方括号会被解析为
            # 字符类——用 -x64*.exe 覆盖（匹配 DSH-Desktop-Setup-*-x64[recommend].exe）。
            dist/DSH-Desktop-Setup-*-x64*.exe
            dist/DSH-Desktop-Portable-*-x64.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect preview assets
        uses: actions/download-artifact@v4
        with:
          pattern: DSH-Desktop-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Verify preview assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup-.+-x64\[recommend\]|Portable-.+-x64)\.exe$'
          if ($assets.Count -ne 2) {
            throw "Expected two release assets, found $($assets.Count)."
          }
      - name: Publish preview assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          # gh release create 会对上传路径做 glob 展开，[recommend] 的方括号
          # 会被当作字符类而匹配不到字面文件名（"no matches found"）——
          # 转义为 \[ \] 让 glob 匹配字面方括号。
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup-.+-x64\[recommend\]|Portable-.+-x64)\.exe$' |
            Select-Object -ExpandProperty FullName |
            ForEach-Object { $_.Replace('[', '\[').Replace(']', '\]') }
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "DSH Desktop $tag" `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            --verify-tag
