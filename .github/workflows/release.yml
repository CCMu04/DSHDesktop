name: Release preview

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty for build-only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ls --all
      - run: npm test
      - run: npm run prepare:runtime
      - run: npm run prepare:node
      # 经 scripts/electron-builder.mjs 启动：未设 ELECTRON_MIRROR /
      # ELECTRON_BUILDER_BINARIES_MIRROR 时默认走 npmmirror 镜像（全球可达），
      # 避免 electron-builder 从 GitHub CDN 拉 Electron/工具集时在 runner 上卡死。
      - run: node scripts/electron-builder.mjs --win nsis portable --x64 --publish never
      - name: Save x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ github.run_id }}-x64
          path: |
            dist/DSH-Desktop-Setup-*-x64.exe
            dist/DSH-Desktop-Portable-*-x64.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect preview assets
        uses: actions/download-artifact@v4
        with:
          pattern: DSH-Desktop-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Verify preview assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup|Portable)-.+-x64\.exe$'
          if ($assets.Count -ne 2) {
            throw "Expected two release assets, found $($assets.Count)."
          }
          if (-not (Test-Path -LiteralPath (Join-Path dist 'latest.yml'))) {
            throw "Missing latest.yml (required for auto-update)."
          }
      - name: Publish preview assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -Match '^DSH-Desktop-(Setup|Portable)-.+-x64\.exe$' -or $_.Name -eq 'latest.yml' -or $_.Name -Match '\.blockmap$' } |
            Select-Object -ExpandProperty FullName
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "DSH Desktop $tag" `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            --verify-tag
