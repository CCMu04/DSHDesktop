name: Release preview

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.arch == 'ia32'
        run: npm run prepare:node-pty-ia32
      - run: npm run prepare:runtime
      - run: npx electron-builder --win nsis portable --${{ matrix.arch }}
      - name: Save ${{ matrix.arch }} assets
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            dist/DSH-Desktop-Setup-*-${{ matrix.arch }}.exe
            dist/DSH-Desktop-Portable-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect preview assets
        uses: actions/download-artifact@v4
        with:
          pattern: DSH-Desktop-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Verify preview assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup|Portable)-.+-(x64|ia32)\.exe$'
          if ($assets.Count -ne 4) {
            throw "Expected four release assets, found $($assets.Count)."
          }
      - name: Publish preview assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup|Portable)-.+-(x64|ia32)\.exe$' |
            Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "DSH Desktop $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            --verify-tag
