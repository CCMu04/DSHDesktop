name: Release preview

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty for build-only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:runtime
      - run: npm run prepare:node
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Stage release assets
        shell: pwsh
        run: |
          # 把两个安装包收进独立目录：gh release create 对文件参数做 glob
          # 展开，setup 文件名里的 [recommend] 会被当作字符类（既匹配不到
          # 字面文件名，也不支持 \[ 转义）——传目录让 gh 直接遍历上传。
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/DSH-Desktop-Setup-*-x64*.exe release-assets/
          Copy-Item dist/DSH-Desktop-Portable-*-x64.exe release-assets/
      - name: Save x64 assets
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-${{ github.run_id }}-x64
          path: release-assets
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect preview assets
        uses: actions/download-artifact@v4
        with:
          pattern: DSH-Desktop-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Verify preview assets
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist/release-assets -File |
            Where-Object Name -Match '^DSH-Desktop-(Setup-.+-x64\[recommend\]|Portable-.+-x64)\.exe$'
          if ($assets.Count -ne 2) {
            throw "Expected two release assets, found $($assets.Count)."
          }
      - name: Publish preview assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          # 传目录（gh 遍历上传，文件名任意），避免 setup 文件名里的
          # [recommend] 触发 gh 的 glob 字符类解析。
          gh release create $tag dist/release-assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "DSH Desktop $tag" `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            --verify-tag
