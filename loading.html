<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Dock</title>
    <style>
      /* Mirrors the official DSH boot screen (AppRoot boot gate, built from
         dsh-client-web AppRoot.module.css). Values are the resolved
         --dsw-alias-* tokens of the shipped design platform, inlined as
         light/dark fallbacks because the DSH theme stylesheet is not loaded
         yet at this stage:
           light: bg-base #ffffff · label-primary #0f1115
                  label-tertiary #81858c · border-l2 rgba(0,0,0,.1)
                  brand-primary #0f1115
           dark:  bg-base #151517 · label-primary #f9fafb
                  label-tertiary rgb(173,178,184) · border-l2 rgba(255,255,255,.12)
                  brand-primary #f9fafb
         (The #3964fe brand blue from the CSS fallback is NOT what the real
         boot screen renders — the resolved brand-primary is neutral.) */
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .titlebar-drag {
        position: fixed;
        inset: 0 150px auto 0;
        height: 38px;
        -webkit-app-region: drag;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #0f1115;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        flex: none;
      }
      .wordmark {
        font-size: 18px;
        line-height: 24px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .mascot {
        width: 112px;
        height: 56px;
        margin: -4px 0;
        color: #0f1115;
        opacity: 0.16;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-top-color: #0f1115;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint {
        font-size: 12px;
        line-height: 18px;
        color: #81858c;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; }
        .brand, .mascot { color: #f9fafb; }
        .mascot { opacity: 0.2; }
        .spinner {
          border-color: rgba(255, 255, 255, 0.12);
          border-top-color: #f9fafb;
        }
        .hint { color: rgb(173, 178, 184); }
      }
    </style>
  </head>
  <body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <main class="card">
      <div class="brand" aria-label="DSH Dock">
        <svg class="brand-mark" viewBox="0 0 320 320" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M220 72H72V248" stroke-width="14" />
            <path d="M72 248H252" stroke-width="16" />
            <path d="M100 119L139 160L100 201M162 201H207" stroke-width="16" />
          </g>
        </svg>
        <div class="wordmark">DSH Dock</div>
      </div>
      <svg class="mascot" viewBox="0 0 640 320" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M78 185C104 112 180 77 274 86C337 92 383 116 418 151C436 140 447 121 451 97C472 111 485 131 487 155C511 162 530 177 542 198C515 208 487 206 463 195C449 189 437 181 426 170C393 230 323 257 239 248C154 239 97 216 78 185Z" stroke-width="16" />
          <circle cx="146" cy="163" r="7" fill="currentColor" stroke="none" />
          <path d="M262 188C275 209 296 222 322 226" stroke-width="14" />
          <path d="M212 86C207 69 196 58 181 52M222 86C230 68 243 58 258 54" stroke-width="12" />
        </g>
      </svg>
      <div class="spinner" aria-label="正在加载"></div>
      <div class="hint" role="status" data-loading-status>正在启动本地服务…</div>
    </main>
  </body>
</html>
