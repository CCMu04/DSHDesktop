<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      /* Mirrors the official DSH boot screen (app-shell boot component):
         centered card with the HARNESS wordmark, the 20px ring spinner and
         the 12px hint, on the --dsw-alias-bg-base surface. The design tokens
         are inlined as light/dark fallbacks because the DSH theme stylesheet
         is not loaded yet at this stage. */
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f9fafb;
      }
      .titlebar-drag {
        position: fixed;
        inset: 0 150px auto 0;
        height: 38px;
        -webkit-app-region: drag;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .wordmark {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #0f1115;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-top-color: #3964fe;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint {
        font-size: 12px;
        line-height: 18px;
        color: #81858c;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; }
        .wordmark { color: #ebeef2; }
        .spinner {
          border-color: rgba(255, 255, 255, 0.12);
          border-top-color: #f9fafb;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <main class="card">
      <div class="wordmark">HARNESS</div>
      <div class="spinner" aria-label="正在加载"></div>
      <div class="hint" role="status" data-loading-status>正在启动本地服务…</div>
    </main>
  </body>
</html>
