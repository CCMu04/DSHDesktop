<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f7f8fa;
        color: #16181d;
      }
      main { text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 650; }
      p { margin: 0; color: #6a6f7a; font-size: 14px; }
      .spinner {
        width: 24px;
        height: 24px;
        margin: 28px auto 0;
        border: 3px solid #d9dce3;
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #14161a; color: #f4f5f7; }
        p { color: #a5a9b3; }
        img { filter: invert(1); }
        .spinner { border-color: #343841; border-top-color: #7f96ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/favicon.svg" alt="" />
      <h1>DeepSeek Harness</h1>
      <p data-loading-status>正在启动本地服务…</p>
      <div class="spinner" aria-label="正在加载"></div>
    </main>
  </body>
</html>
