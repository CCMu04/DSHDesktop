<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      /* Mirrors the official DSH boot screen (AppRoot boot gate, built from
         dsh-client-web AppRoot.module.css). Values are the resolved
         --dsw-alias-* tokens of the shipped design platform, inlined as
         light/dark fallbacks because the DSH theme stylesheet is not loaded
         yet at this stage:
           light: bg-base #ffffff · label-primary #0f1115
                  label-tertiary #81858c · border-l2 rgba(0,0,0,.1)
                  brand-primary #0f1115
           dark:  bg-base #151517 · label-primary #f9fafb
                  label-tertiary rgb(173,178,184) · border-l2 rgba(255,255,255,.12)
                  brand-primary #f9fafb
         (The #3964fe brand blue from the CSS fallback is NOT what the real
         boot screen renders — the resolved brand-primary is neutral.) */
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .titlebar-drag {
        position: fixed;
        inset: 0 150px auto 0;
        height: 38px;
        -webkit-app-region: drag;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .wordmark {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #0f1115;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-top-color: #0f1115;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint {
        font-size: 12px;
        line-height: 18px;
        color: #81858c;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; }
        .wordmark { color: #f9fafb; }
        .spinner {
          border-color: rgba(255, 255, 255, 0.12);
          border-top-color: #f9fafb;
        }
        .hint { color: rgb(173, 178, 184); }
      }
    </style>
  </head>
  <body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <main class="card">
      <div class="wordmark">HARNESS</div>
      <div class="spinner" aria-label="正在加载"></div>
      <div class="hint" role="status" data-loading-status>正在启动本地服务…</div>
    </main>
  </body>
</html>
